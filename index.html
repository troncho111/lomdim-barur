<!doctype html>
<html lang="he" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#17243b">
<link rel="icon" href="data:,">
<title>לומדים ברור</title>
<style>
:root{--ink:#17243b;--muted:#667085;--paper:#fbfcff;--line:#dce4f0;--blue:#3157d5;--blue-soft:#eaf0ff;--gold:#f1b84b;--green:#0b8b6b;--danger:#b42318;--white:#fff;--bg:#eef3f9;--shadow:0 18px 50px rgba(26,45,85,.10);--reader-size:18px}
*{box-sizing:border-box}html{scroll-behavior:smooth;max-width:100%;overflow-x:hidden}body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Arial,sans-serif;min-height:100vh;max-width:100%;overflow-x:hidden}button,input,textarea,select{font:inherit;color:inherit}button{cursor:pointer}.shell{display:grid;grid-template-columns:300px 1fr;min-height:100vh}.sidebar{background:#16243b;color:white;padding:34px 24px;display:flex;flex-direction:column;gap:26px}.brand{display:flex;gap:12px;align-items:center}.mark{width:42px;height:42px;background:var(--gold);color:#17243b;display:grid;place-items:center;border-radius:13px;font-size:22px;font-weight:900;transform:rotate(-4deg)}.brand strong{font-size:20px;display:block}.brand span{font-size:13px;color:#bbc7dc}.primary-light{border:0;border-radius:14px;background:white;color:#17243b;padding:13px 15px;font-weight:800;text-align:right}.nav{display:grid;gap:8px}.nav button{border:0;background:transparent;color:#c9d5e8;text-align:right;padding:12px 14px;border-radius:12px}.nav button[aria-pressed="true"]{background:#2a3b58;color:white}.side-actions{display:grid;gap:8px;margin-top:auto}.side-actions button{border:1px solid #40516d;background:transparent;color:#c9d5e8;border-radius:11px;padding:10px;text-align:right}.side-note{color:#97a9c2;font-size:12px;line-height:1.5}.main{padding:34px 46px 70px;overflow:hidden}.top{display:flex;justify-content:space-between;align-items:center;gap:20px;margin-bottom:28px}.top h1{font-size:clamp(27px,3vw,42px);margin:0;letter-spacing:-1.2px}.top p{margin:7px 0 0;color:var(--muted)}.search{width:min(340px,40vw);background:white;border:1px solid var(--line);border-radius:15px;padding:13px 16px;box-shadow:0 4px 18px rgba(26,45,85,.04)}.stats{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:14px;margin-bottom:24px}.stat{background:white;border:1px solid var(--line);padding:18px 20px;border-radius:18px}.stat b{font-size:27px}.stat span{color:var(--muted);margin-right:8px}.workspace{display:grid;grid-template-columns:minmax(0,1fr) 330px;gap:22px;align-items:start}.reader{background:var(--paper);border:1px solid var(--line);border-radius:24px;box-shadow:var(--shadow);overflow:hidden;min-height:500px}.reader-head{padding:25px 30px 20px;border-bottom:1px solid var(--line);background:linear-gradient(90deg,#fff 0,#f4f7ff 100%)}.reader-tools{display:flex;justify-content:space-between;align-items:center;gap:14px}.eyebrow{color:var(--blue);font-size:13px;font-weight:900}.tool-row{display:flex;gap:7px;align-items:center}.icon-button{border:1px solid var(--line);background:white;border-radius:10px;min-width:36px;height:34px;font-weight:900}.reader h2{font-size:31px;margin:7px 0 10px}.lead{color:#526078;line-height:1.7;margin:0;max-width:780px}.progress{height:5px;background:#e7ecf5}.progress i{display:block;height:100%;background:var(--blue);transition:width .25s}.chapters{padding:24px 30px 12px;display:grid;gap:13px}.chapter{width:100%;display:grid;grid-template-columns:42px 1fr auto;align-items:center;gap:13px;padding:16px;border:1px solid var(--line);border-radius:16px;background:white;text-align:right}.chapter:hover,.chapter[aria-current="true"]{border-color:#9db0f1;box-shadow:0 5px 20px rgba(49,87,213,.08)}.num{width:38px;height:38px;border-radius:12px;background:var(--blue-soft);color:var(--blue);display:grid;place-items:center;font-weight:900}.chapter b{display:block}.chapter small{color:var(--muted);line-height:1.5}.check{width:25px;height:25px;border-radius:50%;border:2px solid #c8d1df;display:grid;place-items:center}.done .check{background:var(--green);border-color:var(--green);color:white}.chapter-body{margin:0 30px 24px;padding:24px 26px;border-right:4px solid var(--gold);background:#fff;border-radius:14px;font-size:var(--reader-size);line-height:1.95;white-space:pre-line}.chapter-body h3{margin:0 0 8px;font-size:1.18em}.reader-actions{display:flex;gap:9px;flex-wrap:wrap;padding:0 30px 28px}.button{border:0;border-radius:11px;padding:10px 14px;font-weight:800}.button.primary{background:var(--blue);color:white}.button.soft{background:var(--blue-soft);color:var(--blue)}.button.ghost{background:white;border:1px solid var(--line)}.button.danger{color:var(--danger);background:#fff0ef}.topics{display:grid;gap:12px}.topics-head{display:flex;justify-content:space-between;align-items:center}.topics h3{margin:0}.link-button{border:0;background:transparent;color:var(--blue);font-weight:800}.topic{background:white;border:1px solid var(--line);border-radius:18px;padding:17px;display:grid;gap:12px}.topic.selected{border-color:#8ea4ed;box-shadow:0 6px 20px rgba(49,87,213,.08)}.topic-top{display:flex;justify-content:space-between;gap:10px}.badge{font-size:12px;font-weight:800;background:#fff5df;color:#936300;padding:5px 9px;border-radius:999px;white-space:nowrap}.topic p{margin:0;color:var(--muted);font-size:14px;line-height:1.55}.mini-progress{height:6px;background:#edf0f5;border-radius:99px;overflow:hidden}.mini-progress i{display:block;height:100%;background:var(--blue)}.topic button{border:0;background:var(--blue-soft);color:var(--blue);font-weight:800;padding:10px;border-radius:11px}.empty{background:white;border:1px dashed #aebbd0;border-radius:18px;padding:28px;text-align:center;color:var(--muted)}.empty strong{display:block;color:var(--ink);font-size:18px;margin-bottom:5px}.reader-empty{min-height:500px;display:grid;place-items:center;padding:30px}.reader-empty div{text-align:center;max-width:380px}.reader-empty b{font-size:24px;display:block;margin-bottom:7px}.reader-empty p{color:var(--muted);line-height:1.6}.reader-empty button{margin-top:8px}dialog{border:0;border-radius:22px;padding:0;width:min(560px,calc(100vw - 28px));box-shadow:0 30px 100px rgba(14,29,55,.28)}dialog::backdrop{background:rgba(19,32,53,.55);backdrop-filter:blur(3px)}.dialog-head{display:flex;align-items:center;justify-content:space-between;padding:21px 23px;border-bottom:1px solid var(--line)}.dialog-head h2{margin:0;font-size:23px}.close{border:0;background:#eef2f7;border-radius:50%;width:34px;height:34px;font-size:18px}.form{padding:22px 23px;display:grid;gap:16px}.field{display:grid;gap:7px}.field span{font-size:14px;font-weight:800}.field input,.field textarea,.field select{width:100%;border:1px solid #bcc8da;border-radius:11px;padding:11px 12px;background:white}.field textarea{min-height:150px;resize:vertical;line-height:1.6}.form-actions{display:flex;justify-content:flex-start;gap:9px;margin-top:3px}.error{color:var(--danger);font-size:13px;min-height:18px}.toast{position:fixed;bottom:24px;left:24px;background:#17243b;color:white;padding:12px 17px;border-radius:12px;box-shadow:var(--shadow);z-index:20}.toast[hidden]{display:none}.sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}.shell,.main,.workspace,.reader,.topics,.topic,.chapter,.reader-head{min-width:0}.reader h2,.topic b,.chapter b,.lead{overflow-wrap:anywhere}
@media(max-width:980px){.shell{grid-template-columns:1fr}.sidebar{padding:16px 18px;flex-direction:row;align-items:center;position:sticky;top:0;z-index:3}.nav,.side-note{display:none}.side-actions{margin:0 0 0 auto;display:flex}.side-actions button{display:none}.side-actions label{display:none}.main{padding:24px 18px 55px}.workspace{grid-template-columns:1fr}.topics{grid-template-columns:repeat(2,1fr)}.topics-head{grid-column:1/-1}}
@media(max-width:620px){.brand span{display:none}.primary-light{font-size:0;padding:11px}.primary-light::after{content:"＋";font-size:22px}.top{align-items:flex-start;flex-direction:column}.search{width:100%}.stats{grid-template-columns:1fr}.stat:nth-child(n+2){display:none}.reader-head,.chapters{padding-right:20px;padding-left:20px}.chapter-body{margin-right:20px;margin-left:20px}.reader-actions{padding-right:20px;padding-left:20px}.topics{grid-template-columns:1fr}.chapter{grid-template-columns:38px minmax(0,1fr) 25px;padding:14px 12px;gap:10px}.reader-tools{align-items:flex-start;flex-direction:column}.reader h2{font-size:26px}}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px}@media(prefers-reduced-motion:reduce){*{scroll-behavior:auto!important;transition:none!important}}
</style>
</head>
<body>
<div class="shell">
  <aside class="sidebar">
    <div class="brand"><div class="mark" aria-hidden="true">ל</div><div><strong>לומדים ברור</strong><span>הידע החשוב שלך, בעברית</span></div></div>
    <button class="primary-light" id="new-topic">＋ נושא חדש</button>
    <nav class="nav" aria-label="סינון נושאים">
      <button data-filter="all" aria-pressed="true">הספרייה שלי</button>
      <button data-filter="active" aria-pressed="false">בתהליך למידה</button>
      <button data-filter="done" aria-pressed="false">מדריכים שהושלמו</button>
    </nav>
    <div class="side-actions">
      <button id="export-data">↓ גיבוי לקובץ</button>
      <label><span class="sr-only">ייבוא גיבוי</span><input class="sr-only" id="import-data" type="file" accept="application/json"><button type="button" id="import-trigger">↑ שחזור מגיבוי</button></label>
      <div class="side-note">המידע נשמר מקומית בדפדפן שלך. מומלץ להוריד גיבוי מדי פעם.</div>
    </div>
  </aside>
  <main class="main">
    <header class="top"><div><h1>מה חשוב ללמוד עכשיו?</h1><p>נושא אחד בכל פעם. בלי רעש, בלי ללכת לאיבוד.</p></div><input class="search" id="search" aria-label="חיפוש בנושא" placeholder="חיפוש בנושא…"></header>
    <section class="stats" aria-label="סיכום"><div class="stat"><b id="stat-topics">0</b><span>נושאים</span></div><div class="stat"><b id="stat-chapters">0</b><span>פרקים שהושלמו</span></div><div class="stat"><b id="stat-progress">0%</b><span>התקדמות כוללת</span></div></section>
    <div class="workspace">
      <section class="reader" id="reader" aria-live="polite"></section>
      <section class="topics" aria-label="הנושאים שלי"><div class="topics-head"><h3>הנושאים שלך</h3><button class="link-button" id="show-all">הכול</button></div><div id="topic-list" style="display:contents"></div></section>
    </div>
  </main>
</div>

<dialog id="topic-dialog" aria-labelledby="topic-dialog-title">
  <div class="dialog-head"><h2 id="topic-dialog-title">נושא חדש</h2><button class="close" type="button" data-close="topic-dialog" aria-label="סגירה">×</button></div>
  <form class="form" id="topic-form">
    <input type="hidden" id="topic-id">
    <label class="field"><span>שם הנושא</span><input id="topic-title" required maxlength="100" placeholder="למשל: אבטחת מידע לסוכני AI"></label>
    <label class="field"><span>למה אני רוצה ללמוד את זה?</span><textarea id="topic-summary" required maxlength="500" placeholder="משפט אחד שיעזור לך לזכור למה הנושא חשוב."></textarea></label>
    <label class="field"><span>עדיפות</span><select id="topic-priority"><option>חשוב</option><option>ללמוד</option><option>מתישהו</option></select></label>
    <div class="error" id="topic-error" role="alert"></div>
    <div class="form-actions"><button class="button primary" type="submit">שמירת נושא</button><button class="button ghost" type="button" data-close="topic-dialog">ביטול</button></div>
  </form>
</dialog>

<dialog id="chapter-dialog" aria-labelledby="chapter-dialog-title">
  <div class="dialog-head"><h2 id="chapter-dialog-title">פרק חדש</h2><button class="close" type="button" data-close="chapter-dialog" aria-label="סגירה">×</button></div>
  <form class="form" id="chapter-form">
    <input type="hidden" id="chapter-id">
    <label class="field"><span>כותרת הפרק</span><input id="chapter-title" required maxlength="120" placeholder="מה בדיוק לומדים בפרק הזה?"></label>
    <label class="field"><span>תקציר קצר</span><input id="chapter-summary" required maxlength="180" placeholder="שורה אחת שתסביר מה מחכה בפנים."></label>
    <label class="field"><span>תוכן המדריך בעברית</span><textarea id="chapter-body" required maxlength="20000" placeholder="כתוב כאן בשפה פשוטה. אפשר להשתמש בשורות ריקות כדי להפריד בין רעיונות."></textarea></label>
    <div class="error" id="chapter-error" role="alert"></div>
    <div class="form-actions"><button class="button primary" type="submit">שמירת פרק</button><button class="button ghost" type="button" data-close="chapter-dialog">ביטול</button></div>
  </form>
</dialog>

<div class="toast" id="toast" role="status" hidden></div>
<script>
if(new URLSearchParams(location.search).get('panel'))document.body.style.zoom=1.55;
const STORAGE_KEY='hebrew-learning-guides-v1';
const DEFAULT_TOPICS=[{
  id:'reverse-engineering',title:'Reverse Engineering לסוכני AI',priority:'חשוב',
  summary:'להבין מערכת קיימת לפני שנוגעים בה — מהמבנה הכללי, דרך זרימת המידע ועד הוכחה בטוחה של המסקנות.',
  chapters:[
    {id:'big-picture',title:'התמונה הגדולה',summary:'מה מנסים לגלות ולמה לא מתחילים מהקוד',done:true,body:'Reverse Engineering מתחיל בשאלה: מה המערכת עושה בפועל?\n\nלפני שקוראים קבצים, מגדירים את ההתנהגות שרוצים להבין: מי משתמש במערכת, מה נכנס אליה, ומה אמור לצאת. כך נמנעים מצלילה לפרטים שלא קשורים לבעיה.\n\nהמטרה איננה לדעת כל שורת קוד. המטרה היא לבנות מפה מספיק מדויקת כדי להסביר את הזרימה ולבדוק אותה.'},
    {id:'entry-points',title:'מיפוי נקודות כניסה',summary:'קבצים, תהליכים, API ומקורות מידע',done:true,body:'מחפשים את המקומות שמהם פעולה מתחילה: כתובת API, כפתור בממשק, משימה מתוזמנת, webhook או פקודת CLI.\n\nמכל נקודת כניסה עוקבים רק אחרי הקריאות הישירות שלה. לא קוראים את כל הפרויקט. מציירים מסלול קצר: קלט ← עיבוד ← אחסון ← פלט.\n\nרק לאחר שיש מסלול ברור פותחים את הקבצים שמממשים אותו.'},
    {id:'real-flow',title:'מעקב אחרי הזרימה האמיתית',summary:'מה המשתמש עושה ומה המערכת עושה מאחור',done:false,body:'קוד מתאר מה אמור לקרות. לוגים, רשת ומסד נתונים מראים מה קרה באמת.\n\nמריצים פעולה אחת מבוקרת ועוקבים אחריה מקצה לקצה. רושמים זמן, קלט, תגובת הרשת והשינוי שנשמר. אם יש פער בין הקוד לתוצאה — התוצאה החיה קודמת להשערה.\n\nהבדיקה הטובה ביותר קטנה, חוזרת על עצמה ואינה משנה מידע אמיתי.'},
    {id:'proof',title:'הוכחה לפני שינוי',summary:'איך מבדילים בין חשד לממצא',done:false,body:'ממצא דורש שתי בדיקות בלתי תלויות. לדוגמה: תגובת API יחד עם שורה במסד הנתונים, או צילום מסך יחד עם לוג שרת.\n\nקובץ מקומי, diff או הסבר הגיוני הם חשד בלבד עד שהמערכת החיה מאשרת אותם.\n\nרק אחרי שהשורש הוכח משנים את המקום המשותף שדרכו עוברים כל המקרים — ולא מוסיפים תיקון נפרד לכל סימפטום.'}
  ]
}];
let topics=loadTopics();
let selectedId=topics[0]?.id||null;
let selectedChapterId=topics[0]?.chapters?.find(c=>!c.done)?.id||topics[0]?.chapters?.[0]?.id||null;
let filter='all';
let readerScale=Number(localStorage.getItem('hebrew-learning-reader-scale')||1);

const $=id=>document.getElementById(id);
function clone(value){return JSON.parse(JSON.stringify(value))}
function uid(){return `${Date.now().toString(36)}-${Math.random().toString(36).slice(2,8)}`}
function validTopic(value){return value&&typeof value.id==='string'&&typeof value.title==='string'&&value.title.trim()&&typeof value.summary==='string'&&Array.isArray(value.chapters)&&value.chapters.every(validChapter)}
function validChapter(value){return value&&typeof value.id==='string'&&typeof value.title==='string'&&value.title.trim()&&typeof value.summary==='string'&&typeof value.body==='string'&&typeof value.done==='boolean'}
function loadTopics(){try{const raw=localStorage.getItem(STORAGE_KEY);if(!raw)return clone(DEFAULT_TOPICS);const parsed=JSON.parse(raw);return Array.isArray(parsed)&&parsed.every(validTopic)?parsed:clone(DEFAULT_TOPICS)}catch{return clone(DEFAULT_TOPICS)}}
function saveTopics(){localStorage.setItem(STORAGE_KEY,JSON.stringify(topics))}
function topicProgress(topic){const total=topic.chapters.length;return total?Math.round(topic.chapters.filter(c=>c.done).length/total*100):0}
function currentTopic(){return topics.find(t=>t.id===selectedId)||null}
function el(tag,className,text){const node=document.createElement(tag);if(className)node.className=className;if(text!==undefined)node.textContent=text;return node}
function showToast(message){const node=$('toast');node.textContent=message;node.hidden=false;clearTimeout(showToast.timer);showToast.timer=setTimeout(()=>node.hidden=true,2200)}
function updateStats(){const chapters=topics.flatMap(t=>t.chapters),done=chapters.filter(c=>c.done).length;$('stat-topics').textContent=topics.length;$('stat-chapters').textContent=done;$('stat-progress').textContent=`${chapters.length?Math.round(done/chapters.length*100):0}%`}
function filteredTopics(){const query=$('search').value.trim().toLocaleLowerCase('he');return topics.filter(topic=>{const matchesText=!query||`${topic.title} ${topic.summary}`.toLocaleLowerCase('he').includes(query);const progress=topicProgress(topic);const matchesFilter=filter==='all'||filter==='active'&&progress<100||filter==='done'&&progress===100;return matchesText&&matchesFilter})}
function renderTopics(){const list=$('topic-list');list.replaceChildren();const visible=filteredTopics();if(!visible.length){const box=el('div','empty');box.append(el('strong','',topics.length?'לא נמצאו נושאים':'הספרייה עדיין ריקה'),document.createTextNode(topics.length?'נסה חיפוש אחר או הצג הכול.':'הוסף את הדבר הראשון שחשוב לך ללמוד.'));list.append(box);return}visible.forEach(topic=>{const card=el('article',`topic${topic.id===selectedId?' selected':''}`);const top=el('div','topic-top');top.append(el('b','',topic.title),el('span','badge',topic.priority));const summary=el('p','',topic.summary);const progress=el('div','mini-progress');progress.setAttribute('aria-label',`${topicProgress(topic)} אחוז הושלמו`);const bar=el('i');bar.style.width=`${topicProgress(topic)}%`;progress.append(bar);const open=el('button','',topic.id===selectedId?'פתוח עכשיו':'פתיחת מדריך');open.addEventListener('click',()=>selectTopic(topic.id));card.append(top,summary,progress,open);list.append(card)})}
function renderReader(){document.documentElement.style.setProperty('--reader-size',`${18*readerScale}px`);const reader=$('reader'),topic=currentTopic();reader.replaceChildren();if(!topic){const empty=el('div','reader-empty'),inner=el('div');inner.append(el('b','','המדריך הבא מתחיל בנושא אחד'),el('p','','הוסף נושא שמעסיק אותך. אחר כך נחלק אותו לפרקים קצרים ונוחים לקריאה.'));const add=el('button','button primary','＋ הוספת נושא ראשון');add.addEventListener('click',()=>openTopicDialog());inner.append(add);empty.append(inner);reader.append(empty);return}
  const head=el('div','reader-head'),tools=el('div','reader-tools'),label=el('span','eyebrow',`${topicProgress(topic)}% הושלמו · ${topic.chapters.length} פרקים`),toolRow=el('div','tool-row');
  [['א−',.9,'טקסט קטן'],['א',1,'טקסט רגיל'],['א＋',1.18,'טקסט גדול']].forEach(([text,size,aria])=>{const b=el('button','icon-button',text);b.type='button';b.setAttribute('aria-label',aria);b.addEventListener('click',()=>{readerScale=size;localStorage.setItem('hebrew-learning-reader-scale',String(size));renderReader()});toolRow.append(b)});tools.append(label,toolRow);head.append(tools,el('h2','',topic.title),el('p','lead',topic.summary));reader.append(head);
  const progress=el('div','progress');const bar=el('i');bar.style.width=`${topicProgress(topic)}%`;progress.append(bar);reader.append(progress);
  const chapters=el('div','chapters');topic.chapters.forEach((chapter,index)=>{const button=el('button',`chapter${chapter.done?' done':''}`);button.type='button';button.setAttribute('aria-current',String(chapter.id===selectedChapterId));button.addEventListener('click',()=>{selectedChapterId=chapter.id;renderReader()});button.append(el('span','num',String(index+1)));const copy=el('span');copy.append(el('b','',chapter.title),el('small','',chapter.summary));button.append(copy,el('span','check',chapter.done?'✓':''));chapters.append(button)});reader.append(chapters);
  const selected=topic.chapters.find(c=>c.id===selectedChapterId)||topic.chapters[0];if(selected){const body=el('section','chapter-body');body.append(el('h3','',selected.title),document.createTextNode(selected.body));reader.append(body)}
  const actions=el('div','reader-actions');if(selected){const complete=el('button',selected.done?'button ghost':'button primary',selected.done?'סימון כלא הושלם':'✓ סיימתי את הפרק');complete.addEventListener('click',()=>toggleChapter(selected.id));const editChapter=el('button','button soft','עריכת הפרק');editChapter.addEventListener('click',()=>openChapterDialog(selected));actions.append(complete,editChapter)}const addChapter=el('button','button soft','＋ הוספת פרק');addChapter.addEventListener('click',()=>openChapterDialog());const editTopic=el('button','button ghost','עריכת הנושא');editTopic.addEventListener('click',()=>openTopicDialog(topic));const remove=el('button','button danger','מחיקת הנושא');remove.addEventListener('click',deleteTopic);actions.append(addChapter,editTopic,remove);reader.append(actions)
}
function render(){updateStats();renderTopics();renderReader()}
function selectTopic(id){selectedId=id;const topic=currentTopic();selectedChapterId=topic?.chapters.find(c=>!c.done)?.id||topic?.chapters[0]?.id||null;render()}
function toggleChapter(id){const topic=currentTopic(),chapter=topic?.chapters.find(c=>c.id===id);if(!chapter)return;chapter.done=!chapter.done;saveTopics();render();showToast(chapter.done?'הפרק הושלם':'הפרק סומן כלא הושלם')}
function openTopicDialog(topic=null){$('topic-dialog-title').textContent=topic?'עריכת נושא':'נושא חדש';$('topic-id').value=topic?.id||'';$('topic-title').value=topic?.title||'';$('topic-summary').value=topic?.summary||'';$('topic-priority').value=topic?.priority||'חשוב';$('topic-error').textContent='';$('topic-dialog').showModal();setTimeout(()=>$('topic-title').focus(),0)}
function openChapterDialog(chapter=null){if(!currentTopic())return;$('chapter-dialog-title').textContent=chapter?'עריכת פרק':'פרק חדש';$('chapter-id').value=chapter?.id||'';$('chapter-title').value=chapter?.title||'';$('chapter-summary').value=chapter?.summary||'';$('chapter-body').value=chapter?.body||'';$('chapter-error').textContent='';$('chapter-dialog').showModal();setTimeout(()=>$('chapter-title').focus(),0)}
function closeDialog(id){$(id).close()}
function deleteTopic(){const topic=currentTopic();if(!topic||!confirm(`למחוק את “${topic.title}” ואת כל הפרקים שלו?`))return;topics=topics.filter(t=>t.id!==topic.id);selectedId=topics[0]?.id||null;selectedChapterId=topics[0]?.chapters[0]?.id||null;saveTopics();render();showToast('הנושא נמחק')}
$('topic-form').addEventListener('submit',event=>{event.preventDefault();const id=$('topic-id').value,title=$('topic-title').value.trim(),summary=$('topic-summary').value.trim(),priority=$('topic-priority').value;if(!title||!summary){$('topic-error').textContent='צריך שם לנושא והסבר קצר למה הוא חשוב.';return}if(id){const topic=topics.find(t=>t.id===id);Object.assign(topic,{title,summary,priority})}else{const topic={id:uid(),title,summary,priority,chapters:[]};topics.unshift(topic);selectedId=topic.id;selectedChapterId=null}saveTopics();closeDialog('topic-dialog');render();showToast('הנושא נשמר')});
$('chapter-form').addEventListener('submit',event=>{event.preventDefault();const topic=currentTopic(),id=$('chapter-id').value,title=$('chapter-title').value.trim(),summary=$('chapter-summary').value.trim(),body=$('chapter-body').value.trim();if(!topic)return;if(!title||!summary||!body){$('chapter-error').textContent='צריך כותרת, תקציר ותוכן לפרק.';return}if(id){const chapter=topic.chapters.find(c=>c.id===id);Object.assign(chapter,{title,summary,body})}else{const chapter={id:uid(),title,summary,body,done:false};topic.chapters.push(chapter);selectedChapterId=chapter.id}saveTopics();closeDialog('chapter-dialog');render();showToast('הפרק נשמר')});
$('new-topic').addEventListener('click',()=>openTopicDialog());$('search').addEventListener('input',renderTopics);$('show-all').addEventListener('click',()=>{$('search').value='';filter='all';document.querySelectorAll('.nav button').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.filter==='all')));renderTopics()});document.querySelectorAll('.nav button').forEach(button=>button.addEventListener('click',()=>{filter=button.dataset.filter;document.querySelectorAll('.nav button').forEach(b=>b.setAttribute('aria-pressed',String(b===button)));renderTopics()}));document.querySelectorAll('[data-close]').forEach(button=>button.addEventListener('click',()=>closeDialog(button.dataset.close)));
$('export-data').addEventListener('click',()=>{const blob=new Blob([JSON.stringify({version:1,exportedAt:new Date().toISOString(),topics},null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=`lomdim-barur-${new Date().toISOString().slice(0,10)}.json`;a.click();URL.revokeObjectURL(url);showToast('הגיבוי ירד למחשב')});
$('import-trigger').addEventListener('click',()=>$('import-data').click());$('import-data').addEventListener('change',async event=>{const file=event.target.files[0];event.target.value='';if(!file)return;try{const parsed=JSON.parse(await file.text()),incoming=Array.isArray(parsed)?parsed:parsed.topics;if(!Array.isArray(incoming)||!incoming.every(validTopic))throw new Error('invalid');if(!confirm('השחזור יחליף את הספרייה הנוכחית. להמשיך?'))return;topics=incoming;selectedId=topics[0]?.id||null;selectedChapterId=topics[0]?.chapters[0]?.id||null;saveTopics();render();showToast('הגיבוי שוחזר')}catch{showToast('הקובץ אינו גיבוי תקין')}});
function selfTest(){const key=`${STORAGE_KEY}-test`;try{const sample={id:'t',title:'בדיקה',summary:'תקציר',priority:'חשוב',chapters:[{id:'c',title:'פרק',summary:'קצר',body:'תוכן',done:false}]};console.assert(validTopic(sample),'valid topic');console.assert(topicProgress(sample)===0,'initial progress');sample.chapters[0].done=true;console.assert(topicProgress(sample)===100,'complete progress');localStorage.setItem(key,JSON.stringify([sample]));console.assert(JSON.parse(localStorage.getItem(key))[0].title==='בדיקה','storage roundtrip');localStorage.removeItem(key);document.documentElement.dataset.selfTest='PASS'}catch(error){localStorage.removeItem(key);document.documentElement.dataset.selfTest=`FAIL:${error.message}`}}
selfTest();render();
</script>
